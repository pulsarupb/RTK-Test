<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RTK GPS Position</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 20px; right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 14px;
            min-width: 220px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        #info h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #aaa;
        }
        #info .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        #info .row:last-child { border-bottom: none; }
        #info .label { color: #999; }
        #info .value { font-weight: 600; font-variant-numeric: tabular-nums; }
        #info .fix-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
        }
        #status-dot {
            position: absolute;
            bottom: 16px; right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.online { background: #4ade80; }
        .dot.offline { background: #ef4444; }
        @media (max-width: 600px) {
            #info { top: 10px; right: 10px; left: 10px; min-width: unset; font-size: 13px; padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="info">
        <h2>RTK Position</h2>
        <div class="row"><span class="label">Latitude</span><span class="value" id="lat">—</span></div>
        <div class="row"><span class="label">Longitude</span><span class="value" id="lon">—</span></div>
        <div class="row"><span class="label">Altitude</span><span class="value" id="alt">—</span></div>
        <div class="row"><span class="label">Fix</span><span class="value"><span class="fix-badge" id="fix">—</span></span></div>
        <div class="row"><span class="label">HDOP</span><span class="value" id="hdop">—</span></div>
        <div class="row"><span class="label">Satellites</span><span class="value" id="sats">—</span></div>
    </div>
    <div id="status-dot">
        <span class="dot" id="connDot"></span>
        <span id="connText">Connecting...</span>
    </div>

    <script>
        const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([0, 0], 2);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
        }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; Esri',
        }).addTo(map);

        let marker = null;
        let circle = null;
        let firstFix = true;

        function getFixColor(code) {
            switch (code) {
                case 4: return '#22c55e';
                case 5: return '#f59e0b';
                case 2: return '#3b82f6';
                case 1: return '#9ca3af';
                case 3: return '#8b5cf6';
                default: return '#ef4444';
            }
        }

        function updateFixBadge(fix, code) {
            const el = document.getElementById('fix');
            el.textContent = fix;
            el.style.background = getFixColor(code) + '33';
            el.style.color = getFixColor(code);
        }

        function updatePosition(data) {
            const lat = data.lat;
            const lon = data.lon;
            const alt = data.alt !== null ? data.alt.toFixed(1) + ' m' : '—';
            const fix = data.fix;
            const fixCode = data.fix_code;
            const hdop = data.hdop !== null ? data.hdop.toFixed(1) : '—';
            const sats = data.sats;

            document.getElementById('lat').textContent = lat.toFixed(6) + '\u00B0';
            document.getElementById('lon').textContent = lon.toFixed(6) + '\u00B0';
            document.getElementById('alt').textContent = alt;
            document.getElementById('hdop').textContent = hdop;
            document.getElementById('sats').textContent = sats;
            updateFixBadge(fix, fixCode);

            if (firstFix || !marker) {
                if (marker) map.removeLayer(marker);
                if (circle) map.removeLayer(circle);

                const color = getFixColor(fixCode);
                marker = L.marker([lat, lon]).addTo(map);
                circle = L.circle([lat, lon], {
                    radius: 3,
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.3,
                    weight: 2,
                }).addTo(map);

                map.setView([lat, lon], 18);
                firstFix = false;
            } else {
                const color = getFixColor(fixCode);
                marker.setLatLng([lat, lon]);
                circle.setLatLng([lat, lon]);
                circle.setStyle({ color: color, fillColor: color });
                if (map.getZoom() >= 14) {
                    map.panTo([lat, lon], { animate: true, duration: 0.3 });
                }
            }

            document.getElementById('connDot').className = 'dot online';
            document.getElementById('connText').textContent = 'Receiving data';
        }

        async function poll() {
            try {
                const resp = await fetch('/api/position');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                if (data.lat !== 0 || data.lon !== 0) {
                    updatePosition(data);
                } else {
                    document.getElementById('connDot').className = 'dot online';
                    document.getElementById('connText').textContent = 'Waiting for GPS fix...';
                }
            } catch (e) {
                document.getElementById('connDot').className = 'dot offline';
                document.getElementById('connText').textContent = 'Disconnected';
            }
        }

        poll();
        setInterval(poll, 1000);
    </script>
</body>
</html>
